services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer-churn-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: customer-churn-frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: "http://backend:8000"
    depends_on:
      - backend
    restart: unless-stopped
